<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>Expense Tracker</h1>
      <p class="subtitle">Log daily spending, categorize it, see your totals.</p>
    </header>

    <section class="card">
      <form id="expense-form">
        <div class="field">
          <label for="date">Date</label>
          <input type="date" id="date" required>
        </div>
        <div class="field">
          <label for="description">Description</label>
          <input type="text" id="description" placeholder="e.g. Coffee" required>
        </div>
        <div class="field">
          <label for="category">Category</label>
          <select id="category" required>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Housing">Housing</option>
            <option value="Utilities">Utilities</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Shopping">Shopping</option>
            <option value="Health">Health</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="field">
          <label for="amount">Amount</label>
          <input type="number" id="amount" step="0.01" min="0.01" placeholder="0.00" required>
        </div>
        <button type="submit">Add Expense</button>
      </form>
    </section>

    <section class="totals card">
      <div class="total-box">
        <span class="label">Total Spent</span>
        <span id="total-amount" class="value">$0.00</span>
      </div>
      <div id="category-totals" class="category-totals"></div>
    </section>

    <section class="card">
      <div class="list-header">
        <h2>Expenses</h2>
        <select id="filter-category">
          <option value="">All Categories</option>
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Housing">Housing</option>
          <option value="Utilities">Utilities</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Shopping">Shopping</option>
          <option value="Health">Health</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <table id="expense-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Description</th>
            <th>Category</th>
            <th>Amount</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="expense-list"></tbody>
      </table>
      <p id="empty-state" class="empty-state">No expenses logged yet.</p>
    </section>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
